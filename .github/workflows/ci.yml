name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas unitarias
        run: bin/unit

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de todos los PHP
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app php:7.4.33-apache \
            sh -c 'find public legacy src -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: Preparar variables de entorno
        run: |
          cp .env.example .env
          sed -i 's/cambia-esto/clave-de-prueba-ci/' .env

      - name: Levantar la aplicación
        run: docker compose up -d --build --wait

      - name: Pantalla de ingreso responde 200
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/login.php)
          echo "login.php: $codigo"
          test "$codigo" = "200"

      - name: Los archivos internos no se sirven
        run: |
          for ruta in /legacy/socios.php /includes/conexion.php; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090$ruta")
            echo "$ruta: $codigo"
            test "$codigo" = "404"
          done

      - name: Tablero sin sesión redirige
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/index.php)
          echo "index.php: $codigo"
          test "$codigo" = "302"

      - name: La fecha fija no se acepta fuera del modo de pruebas
        run: |
          set -euo pipefail
          clave=$(grep '^DEMO_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS -c cookies.txt -o /dev/null \
            --data-urlencode "usuario=admin" --data-urlencode "clave=$clave" \
            http://127.0.0.1:8090/login.php
          curl -fsS -b cookies.txt -o /dev/null -H 'X-Fecha-Fija: 2000-01-01' \
            --data-urlencode "socio_id=12" --data-urlencode "ejemplar_id=20" \
            http://127.0.0.1:8090/prestar.php
          fecha=$(docker compose exec -T db sh -c \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT fecha_prestamo FROM prestamos WHERE ejemplar_id = 20 AND fecha_devolucion IS NULL" "$MYSQL_DATABASE"' 2>/dev/null)
          esperada=$(TZ=America/Bogota date +%F)
          echo "fecha_prestamo guardada: $fecha (esperada: $esperada)"
          test "$fecha" = "$esperada"

      - name: Registros si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v

  characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          cp .env.example .env
          sed -i 's/cambia-esto/clave-de-prueba-ci/' .env

      - name: Pruebas de caracterización
        run: bin/test --build

      - name: Registros si algo falló
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs

      - name: Subir las pantallas que cambiaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pantallas-distintas
          path: tests/characterization/snapshots/_actual
          if-no-files-found: ignore

      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables de entorno
        run: |
          cp .env.example .env
          sed -i 's/cambia-esto/clave-de-prueba-ci/' .env

      - name: Pruebas de integración con MySQL
        run: bin/integration --build

      - name: Registros si algo falló
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs db

      - name: Apagar
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
